name: Cherry compatibility PR bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded source transformation
        run: python3 scripts/apply_cherry_compat.py

      - name: Remove one-shot bootstrap files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/cherry-compat-bootstrap.yml \
            .github/workflows/cherry-compat-pr-bootstrap.yml \
            scripts/apply_cherry_compat.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Cherry CLI compatibility aliases"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
