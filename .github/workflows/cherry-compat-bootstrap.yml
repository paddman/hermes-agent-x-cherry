name: Cherry compatibility bootstrap

on:
  push:
    branches:
      - feature/cherry-cli-compat

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/cherry-cli-compat
          fetch-depth: 0

      - name: Apply compatibility-safe Cherry branding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one match in {path}, found {count}: {old[:80]!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")


          # Package metadata keeps the upstream package name for compatibility,
          # but exposes Cherry-branded launchers and identifies the fork maintainer.
          replace_once(
              "pyproject.toml",
              'description = "The self-improving AI agent — creates skills from experience, improves them during use, and runs anywhere"',
              'description = "Cherry Agent — a security-ready, self-improving AI agent for local, cloud, and multi-channel automation"',
          )
          replace_once(
              "pyproject.toml",
              'authors = [{ name = "Nous Research" }]\n',
              'authors = [{ name = "Nous Research" }]\nmaintainers = [{ name = "paddman" }]\n',
          )
          replace_once(
              "pyproject.toml",
              '''[project.scripts]
          hermes = "hermes_cli.main:main"
          hermes-agent = "run_agent:main"
          hermes-acp = "acp_adapter.entry:main"
          ''',
              '''[project.scripts]
          # Cherry is the preferred public CLI for this fork. The original
          # entry points remain installed so existing scripts and profiles work.
          cherry = "hermes_cli.cherry_entrypoints:cli_main"
          cherry-agent = "hermes_cli.cherry_entrypoints:agent_main"
          cherry-acp = "hermes_cli.cherry_entrypoints:acp_main"
          hermes = "hermes_cli.main:main"
          hermes-agent = "run_agent:main"
          hermes-acp = "acp_adapter.entry:main"
          ''',
          )

          Path("hermes_cli/cherry_entrypoints.py").write_text(
              '''"""Compatibility-safe Cherry command entry points.

          The fork still uses the upstream Hermes runtime, package name, profile
          layout, and internal configuration identifiers. These wrappers provide
          Cherry-branded console commands without breaking existing ``hermes``
          commands or moving user data behind the operator's back.
          """

          from __future__ import annotations

          import os
          from collections.abc import MutableMapping


          def bridge_environment(
              environ: MutableMapping[str, str] | None = None,
          ) -> MutableMapping[str, str]:
              """Bridge stable Cherry environment aliases to runtime names.

              ``CHERRY_HOME`` is accepted by the Cherry launchers and copied to
              ``HERMES_HOME`` only when the legacy variable is unset. Therefore:

              - existing deployments keep their current ``HERMES_HOME`` behavior;
              - new Cherry invocations may choose a custom home with ``CHERRY_HOME``;
              - no automatic migration from ``~/.hermes`` occurs.

              The mapping is applied before importing runtime entry points because
              several modules resolve the home directory during import.
              """
              env = os.environ if environ is None else environ
              cherry_home = env.get("CHERRY_HOME", "").strip()
              hermes_home = env.get("HERMES_HOME", "").strip()
              if cherry_home and not hermes_home:
                  env["HERMES_HOME"] = cherry_home
              return env


          def cli_main() -> object:
              """Run the full CLI through the Cherry-branded launcher."""
              bridge_environment()
              from hermes_cli.main import main as delegated_main

              return delegated_main()


          def agent_main() -> object:
              """Run the low-level agent entry point through the Cherry launcher."""
              bridge_environment()
              from run_agent import main as delegated_main

              return delegated_main()


          def acp_main() -> object:
              """Run the ACP adapter through the Cherry-branded launcher."""
              bridge_environment()
              from acp_adapter.entry import main as delegated_main

              return delegated_main()


          __all__ = ["acp_main", "agent_main", "bridge_environment", "cli_main"]
          ''',
              encoding="utf-8",
          )

          Path("tests/test_cherry_entrypoints.py").write_text(
              '''from __future__ import annotations

          import os
          import sys
          import tomllib
          from pathlib import Path
          from types import ModuleType

          from hermes_cli import cherry_entrypoints


          ROOT = Path(__file__).resolve().parents[1]


          def test_project_exposes_cherry_and_legacy_console_scripts() -> None:
              project = tomllib.loads((ROOT / "pyproject.toml").read_text(encoding="utf-8"))
              scripts = project["project"]["scripts"]

              assert scripts["cherry"] == "hermes_cli.cherry_entrypoints:cli_main"
              assert scripts["cherry-agent"] == "hermes_cli.cherry_entrypoints:agent_main"
              assert scripts["cherry-acp"] == "hermes_cli.cherry_entrypoints:acp_main"
              assert scripts["hermes"] == "hermes_cli.main:main"
              assert scripts["hermes-agent"] == "run_agent:main"
              assert scripts["hermes-acp"] == "acp_adapter.entry:main"


          def test_cherry_home_fills_legacy_runtime_variable() -> None:
              env = {"CHERRY_HOME": "/srv/cherry-agent"}

              result = cherry_entrypoints.bridge_environment(env)

              assert result is env
              assert env["HERMES_HOME"] == "/srv/cherry-agent"


          def test_existing_hermes_home_wins_when_both_are_set() -> None:
              env = {
                  "CHERRY_HOME": "/srv/cherry-agent",
                  "HERMES_HOME": "/srv/existing-hermes-profile",
              }

              cherry_entrypoints.bridge_environment(env)

              assert env["HERMES_HOME"] == "/srv/existing-hermes-profile"


          def test_cli_launcher_bridges_environment_before_lazy_delegate(monkeypatch) -> None:
              fake_module = ModuleType("hermes_cli.main")

              def fake_main() -> int:
                  assert os.environ["HERMES_HOME"] == "/tmp/cherry-home"
                  return 23

              fake_module.main = fake_main  # type: ignore[attr-defined]
              monkeypatch.setitem(sys.modules, "hermes_cli.main", fake_module)
              monkeypatch.setenv("CHERRY_HOME", "/tmp/cherry-home")
              monkeypatch.delenv("HERMES_HOME", raising=False)

              assert cherry_entrypoints.cli_main() == 23
          ''',
              encoding="utf-8",
          )

          Path("docs").mkdir(exist_ok=True)
          Path("docs/cherry-compatibility.md").write_text(
              '''# Cherry compatibility and migration

          Cherry Agent is a derivative fork of Hermes Agent. The public product
          name and preferred launch commands are Cherry-branded, while selected
          runtime identifiers remain unchanged so existing installations do not
          lose profiles, memory, plugins, credentials, or automation scripts.

          ## Commands

          After installing this fork, the following command pairs are equivalent:

          | Preferred Cherry command | Backward-compatible command |
          |---|---|
          | `cherry` | `hermes` |
          | `cherry-agent` | `hermes-agent` |
          | `cherry-acp` | `hermes-acp` |

          The original commands are intentionally retained. Removing them would
          break shell scripts, services, scheduled jobs, containers, and external
          integrations for no operational benefit.

          ## Home directory

          The default data directory remains `~/.hermes` on POSIX and
          `%LOCALAPPDATA%\\hermes` on Windows. Cherry Agent does not silently move
          data because an interrupted or partial migration could split memory,
          credentials, and session state across two locations.

          The Cherry launcher accepts a new stable alias:

          ```bash
          CHERRY_HOME="$HOME/.cherry-agent-dev" cherry
          ```

          Internally the launcher maps `CHERRY_HOME` to `HERMES_HOME` before the
          runtime imports. When both variables are set, `HERMES_HOME` wins to
          preserve existing deployment behavior.

          ## Current compatibility boundary

          These identifiers remain unchanged in this phase:

          - Python distribution name: `hermes-agent`
          - internal Python packages such as `hermes_cli`
          - default profile directory: `~/.hermes`
          - existing `HERMES_*` environment and configuration keys
          - service, plugin, and protocol identifiers consumed by integrations

          Some command output may still say Hermes while the compatibility layer
          is being converted. This is cosmetic; `cherry` and `hermes` currently
          execute the same runtime.

          ## Planned migration phases

          1. **Command aliases:** ship `cherry`, `cherry-agent`, and `cherry-acp`
             while retaining all legacy commands.
          2. **User-facing text:** convert banners, help, desktop labels, and
             documentation where the change does not alter protocol contracts.
          3. **Explicit data migration:** add a dry-run and rollback-capable command
             before offering a new default Cherry home directory.
          4. **Package or protocol rename:** consider only in a major release with
             deprecation notices and compatibility shims.

          ## Licensing

          Rebranding does not remove upstream attribution. The original Nous
          Research copyright and MIT permission notice remain in `LICENSE`, and
          the repository records upstream lineage in `THIRD_PARTY_NOTICES.md`.
          ''',
              encoding="utf-8",
          )

          # README now presents Cherry as the preferred command while documenting
          # the legacy names and unchanged storage boundary honestly.
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old_table = '''| Python project | `hermes-agent` | Retained for package compatibility |
          | CLI command | `hermes` | Retained until a compatibility-safe CLI migration is completed |
          | User data directory | `~/.hermes` | Retained to avoid breaking existing profiles |
          | Existing environment/config keys | `HERMES_*` and Hermes config names | Retained where changing them would break users |
          '''
          new_table = '''| Python project | `hermes-agent` | Retained for package compatibility |
          | Preferred CLI command | `cherry` | Cherry-branded compatibility launcher |
          | Legacy CLI command | `hermes` | Still supported for scripts and existing deployments |
          | User data directory | `~/.hermes` | Retained to avoid breaking existing profiles |
          | Home override | `CHERRY_HOME` or `HERMES_HOME` | `HERMES_HOME` wins when both are set |
          | Existing environment/config keys | `HERMES_*` and Hermes config names | Retained where changing them would break users |
          '''
          if text.count(old_table) != 1:
              raise SystemExit("README compatibility table did not match expected content")
          text = text.replace(old_table, new_table)
          text = text.replace(
              "This distinction is deliberate. Replacing every occurrence of `Hermes` in documentation while the executable is still named `hermes` would produce attractive branding and unusable instructions, a familiar triumph of marketing over reality.",
              "This distinction is deliberate. Cherry now has a real `cherry` launcher, while the original identifiers remain available wherever removing them would break compatibility. Renaming contracts is engineering work, not a search-and-replace séance.",
          )
          if text.count("hermes setup\nhermes") != 2:
              raise SystemExit("README install command blocks did not match expected content")
          text = text.replace("hermes setup\nhermes", "cherry setup\ncherry")
          old_note = '''> [!NOTE]
          > The command remains `hermes` in the current compatibility phase. The README uses the Cherry product name without pretending a `cherry` executable already exists.
          '''
          new_note = '''> [!NOTE]
          > `cherry` is now the preferred command. `hermes` remains installed as a backward-compatible alias, and both currently execute the same runtime. Internal package names, the default `~/.hermes` directory, and some output text remain unchanged in this phase.
          '''
          if text.count(old_note) != 1:
              raise SystemExit("README command note did not match expected content")
          text = text.replace(old_note, new_note)
          old_commands = '''```bash
          hermes                 # Start the interactive agent
          hermes setup           # Configure model providers, tools, and gateways
          hermes model           # Select a model/provider
          hermes tools           # Configure available tools
          hermes config get      # Read configuration
          hermes config set      # Change configuration
          hermes gateway         # Run messaging gateways
          hermes doctor          # Diagnose installation and configuration
          ```
          '''
          new_commands = '''```bash
          cherry                 # Start the interactive agent
          cherry setup           # Configure model providers, tools, and gateways
          cherry model           # Select a model/provider
          cherry tools           # Configure available tools
          cherry config get      # Read configuration
          cherry config set      # Change configuration
          cherry gateway         # Run messaging gateways
          cherry doctor          # Diagnose installation and configuration

          hermes version         # Legacy command remains supported
          ```

          Use a separate Cherry home only when you deliberately want isolated
          profiles and memory:

          ```bash
          CHERRY_HOME="$HOME/.cherry-agent-dev" cherry
          ```

          See [`docs/cherry-compatibility.md`](docs/cherry-compatibility.md) for
          naming, environment precedence, and the staged migration plan.
          '''
          if text.count(old_commands) != 1:
              raise SystemExit("README common commands block did not match expected content")
          text = text.replace(old_commands, new_commands)
          text = text.replace(
              "Use Git for this fork. Do not rely on `hermes update`, because that command belongs to the managed upstream installation flow and may replace fork-specific code.",
              "Use Git for this fork. Do not rely on `cherry update` or `hermes update`, because both currently reach the managed upstream update flow and may replace fork-specific code.",
          )
          docs_anchor = '''- [Cherry PCAP C++ documentation](native/cherry_pcap/README.md)
          - [Cherry PCAP security skill](skills/security/cherry-pcap/SKILL.md)
          '''
          if text.count(docs_anchor) != 1:
              raise SystemExit("README documentation list did not match expected content")
          text = text.replace(
              docs_anchor,
              docs_anchor + "- [Cherry compatibility and migration](docs/cherry-compatibility.md)\n",
          )
          readme.write_text(text, encoding="utf-8")

          # The fork must not direct vulnerability reports to the upstream
          # organization. Preserve the trust-model substance while branding the
          # policy and routing private reports to this repository.
          security = Path("SECURITY.md")
          text = security.read_text(encoding="utf-8")
          old_reporting = '''Report privately via [GitHub Security Advisories](https://github.com/NousResearch/hermes-agent/security/advisories/new)
          or **security@nousresearch.com**. Do not open public issues for
          security vulnerabilities. **Hermes Agent does not operate a bug
          bounty program.**
          '''
          new_reporting = '''Report privately via [GitHub Security Advisories for this fork](https://github.com/paddman/hermes-agent-x-cherry/security/advisories/new).
          Do not open public issues for security vulnerabilities. **Cherry Agent
          does not operate a bug bounty program.**
          '''
          if text.count(old_reporting) != 1:
              raise SystemExit("SECURITY reporting block did not match expected content")
          text = text.replace(old_reporting, new_reporting)
          text = text.replace("Hermes Agent", "Cherry Agent")
          text = text.replace("`hermes version`", "`cherry version` (or `hermes version`)")
          text = text.replace(
              '''- **Channel:** the GHSA thread or email correspondence with
            security@nousresearch.com.
          ''',
              '''- **Channel:** the private GitHub Security Advisory thread for this fork.
          ''',
          )
          lineage_note = '''
          > [!IMPORTANT]
          > This policy governs the Cherry Agent fork. Cherry Agent is derived
          > from Hermes Agent by Nous Research, but fork-specific reports must be
          > submitted to this repository. Report an upstream-only issue to the
          > upstream project separately when appropriate.
          '''
          intro = '''scope for vulnerability reports.
          '''
          if text.count(intro) != 1:
              raise SystemExit("SECURITY introduction did not match expected content")
          text = text.replace(intro, intro + lineage_note, 1)
          security.write_text(text, encoding="utf-8")
          PY

      - name: Remove bootstrap workflow and commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cherry-compat-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml README.md SECURITY.md docs/cherry-compatibility.md \
            hermes_cli/cherry_entrypoints.py tests/test_cherry_entrypoints.py \
            .github/workflows/cherry-compat-bootstrap.yml
          git diff --cached --check
          git commit -m "feat: add Cherry CLI compatibility aliases"
          git push origin HEAD:feature/cherry-cli-compat
